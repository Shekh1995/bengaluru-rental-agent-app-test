name: Bengaluru Rental Agent - CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bengaluru-rental-agent

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint, Static Analysis, and Unit/Integration Testing
  # -------------------------------------------------------------
  test-and-lint:
    name: 🧪 Test & Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code Quality Linting (Flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run PyTest Test Suite
        run: |
          pytest --cov=app --cov-report=term-missing tests/

  # -------------------------------------------------------------
  # Job 2: Build Multi-Stage Docker Container & Push to Registry
  # -------------------------------------------------------------
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Security & Container Vulnerability Scanning (Trivy)
  # -------------------------------------------------------------
  security-scan:
    name: 🛡️ Security Vulnerability Scan
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # Job 4: Deploy / Verification (Kubernetes / Cloud Run Trigger)
  # -------------------------------------------------------------
  deploy-staging:
    name: 🚀 Deploy Staging / K8s Manifest Lint
    needs: [build-and-push-docker, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Kubernetes Manifests
        run: |
          echo "Verifying K8s YAML syntax..."
          python -c "import glob; print(f'Found {len(glob.glob(\"k8s/*.yaml\"))} K8s manifest files')"
          echo "Pipeline Ready for automated cluster CD deployment."
