version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blr-rental-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_agent
      POSTGRES_USER: rental_agent
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - rental-agent-postgres:/var/lib/postgresql/data

  rental-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blr-rental-agent-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://rental_agent:change-this-password@postgres:5432/rental_agent
      - LISTINGS_PROVIDER=${LISTINGS_PROVIDER:-generic}
      - LISTINGS_API_URL=${LISTINGS_API_URL:-}
      - LISTINGS_API_TOKEN=${LISTINGS_API_TOKEN:-}
      - LISTINGS_SYNC_INTERVAL_SECONDS=${LISTINGS_SYNC_INTERVAL_SECONDS:-900}
      - SQUARE_YARDS_LOCATION=${SQUARE_YARDS_LOCATION:-Bengaluru}
      - SQUARE_YARDS_BEDROOMS=${SQUARE_YARDS_BEDROOMS:-2 BHK}
      - SQUARE_YARDS_MIN_PRICE=${SQUARE_YARDS_MIN_PRICE:-}
      - SQUARE_YARDS_MAX_PRICE=${SQUARE_YARDS_MAX_PRICE:-35000}
      - SQUARE_YARDS_SIZE=${SQUARE_YARDS_SIZE:-50}
      - SQUARE_YARDS_PAGE=${SQUARE_YARDS_PAGE:-1}
      - SQUARE_YARDS_MAX_PAGES=${SQUARE_YARDS_MAX_PAGES:-100}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  rental-agent-postgres:
