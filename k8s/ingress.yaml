apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bengaluru-rental-agent-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: rental-agent.bengaluru.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bengaluru-rental-agent-svc
            port:
              number: 80
