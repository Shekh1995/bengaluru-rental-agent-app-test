apiVersion: apps/v1
kind: Deployment
metadata:
  name: bengaluru-rental-agent
  labels:
    app: bengaluru-rental-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bengaluru-rental-agent
  template:
    metadata:
      labels:
        app: bengaluru-rental-agent
    spec:
      containers:
      - name: app
        image: ghcr.io/user/bengaluru-rental-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
